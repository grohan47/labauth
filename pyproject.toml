[project]
name = "labauth"
version = "0.1.0"
description = "Local-first lab presence display and enrollment application"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=3.16.0",
    "pillow>=11.0",
]

[project.optional-dependencies]
# Only needed to push backups to the self-hosted PostgreSQL target.
backup = ["psycopg[binary]>=3.1"]

[tool.uv]
package = false
